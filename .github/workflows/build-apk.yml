name: build apk

on:
  workflow_dispatch:
    inputs:
      repo-url:
        description: 'git clone url'
        required: true
      repo-commit:
        description: 'commit'
      repo-dir:
        description: 'dir ("/..")'
      module:
        description: 'module'
        required: true
        default: 'app'
      googleservices:
        description: 'google-services.json (content)'
      localproperties:
        description: 'local.properties (content)'
      sign:
        type: boolean
        description: 'sign apk'
        default: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: clone target repository
        id: clone_step
        run: |
          git clone ${{ github.event.inputs.repo-url }}
          PROJECT_NAME=$(basename -s .git "${{ github.event.inputs.repo-url }}")
          DIR_NAME=$(echo '${{ github.event.inputs.repo-dir }}' | sed -r 's/[/]+/ - /g')
          
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "dir_name=$DIR_NAME" >> $GITHUB_OUTPUT
          
      - name: select commit
        if: ${{ github.event.inputs.repo-commit != '' }}
        run: |
          cd ${{ steps.clone_step.outputs.project_name }}
          git checkout ${{ github.event.inputs.repo-commit }}

      - name: prepare environment and stitch components
        run: |
          cd ${{ steps.clone_step.outputs.project_name }}
          
          # Inject settings.gradle at root to tell Gradle where 'app' is hidden
          echo "include ':Approot:app'" > settings.gradle
          
          # Fix the gradlew file-clash: convert it into a structural gradle directory framework
          mkdir -p gradle
          if [ -d "gradlew" ]; then
            cp -r gradlew/* gradle/ 2>/dev/null || true
            rm -rf gradlew
          fi
          
          # Generate a clean runtime executable script wrapper at root
          echo '#!/usr/bin/env bash' > ./gradlew
          echo 'exec gradle "$@"' >> ./gradlew
          chmod +x ./gradlew
          
      - name: bypass root gradle validation
        run: |
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          touch gradlew
        
      - name: add google-services.json
        if: ${{ github.event.inputs.googleservices != '' }}
        run: |
          content=$(jq -r '.inputs.googleservices' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          mkdir -p ${{ steps.clone_step.outputs.project_name }}/Approot/${{ github.event.inputs.module }}
          echo "$content" > ${{ steps.clone_step.outputs.project_name }}/Approot/${{ github.event.inputs.module }}/google-services.json
        
      - name: add local.properties
        if: ${{ github.event.inputs.localproperties != '' }}
        run: |
          content=$(jq -r '.inputs.localproperties' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          mkdir -p ${{ steps.clone_step.outputs.project_name }}
          echo "$content" > ${{ steps.clone_step.outputs.project_name }}/local.properties
        
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17
          
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ steps.clone_step.outputs.project_name }}
          
      # FIX: Fallback to the broad global 'assemble' task which works on libraries and multiplatform apps
      - name: build unsigned
        if: ${{ github.event.inputs.sign == false || github.event.inputs.sign == 'false' }}
        run: |
          cd ${{ steps.clone_step.outputs.project_name }}
          ./gradlew :Approot:${{ github.event.inputs.module }}:assemble
          
      # FIX: Fallback to the broad global 'assemble' task which works on libraries and multiplatform apps
      - name: build and sign
        if: ${{ github.event.inputs.sign == true || github.event.inputs.sign == 'true' }}
        run: |
          cd ${{ steps.clone_step.outputs.project_name }}
          ./gradlew :Approot:${{ github.event.inputs.module }}:assemble -Pandroid.injected.signing.store.file='${{ github.workspace }}/grab-keystore.jks' -Pandroid.injected.signing.store.password='grab-pwd' -Pandroid.injected.signing.key.alias='sign' -Pandroid.injected.signing.key.password='grab-pwd'
          
      # FIX: Widened file lookup matchers to capture any generated .apk or library binaries safely
      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.clone_step.outputs.project_name }}${{ steps.clone_step.outputs.dir_name }} - outputs
          path: |
            ${{ github.workspace }}/${{ steps.clone_step.outputs.project_name }}/**/build/outputs/**/*.apk
            ${{ github.workspace }}/${{ steps.clone_step.outputs.project_name }}/**/build/outputs/**/*.aar

name: build apk

on:
  workflow_dispatch:
    inputs:
      repo-url:
        description: 'git clone url'
        required: true
      repo-commit:
        description: 'commit'
      repo-dir:
        description: 'dir ("/..")'
      module:
        description: 'module'
        required: true
        default: 'app'
      googleservices:
        description: 'google-services.json (content)'
      localproperties:
        description: 'local.properties (content)'
      sign:
        type: boolean
        description: 'sign apk'
        default: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: clone
        run: |
          git clone ${{ github.event.inputs.repo-url }}
          PROJECT_NAME=$(basename -s .git "${{ github.event.inputs.repo-url }}")
          echo "projectName=$PROJECT_NAME" >> $GITHUB_ENV
          echo "dirName=$(echo '${{ github.event.inputs.repo-dir }}' | sed -r 's/[/]+/ - /g')" >> $GITHUB_ENV
        
      - name: select commit
        if: ${{ github.event.inputs.repo-commit != '' }}
        run: |
          cd ${{ env.projectName }}
          git checkout ${{ github.event.inputs.repo-commit }}

      - name: locate gradle root
        run: |
          GRADLEW_PATH=$(find ./${{ env.projectName }} -maxdepth 3 -type f -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ ERROR: Could not find a 'gradlew' file anywhere inside the cloned repository!"
            exit 1
          fi
          GRADLE_ROOT_DIR=$(dirname "$GRADLEW_PATH" | sed 's|^\./||')
          echo "Found gradlew at: $GRADLE_ROOT_DIR"
          echo "gradleRoot=$GRADLE_ROOT_DIR" >> $GITHUB_ENV

      - name: bypass root gradle validation
        run: |
          mkdir -p gradle/wrapper
          if [ -f "${{ env.gradleRoot }}/gradle/wrapper/gradle-wrapper.properties" ]; then
            cp "${{ env.gradleRoot }}/gradle/wrapper/gradle-wrapper.properties" ./gradle/wrapper/
            cp "${{ env.gradleRoot }}/gradlew" ./ 2>/dev/null || touch gradlew
          else
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" > gradle/wrapper/gradle-wrapper.properties
            touch gradlew
          fi
        
      - name: add google-services.json
        if: ${{ github.event.inputs.googleservices != '' }}
        run: |
          content=$(jq -r '.inputs.googleservices' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          echo "$content" > ${{ env.gradleRoot }}/${{ github.event.inputs.module }}/google-services.json
        
      - name: add local.properties
        if: ${{ github.event.inputs.localproperties != '' }}
        run: |
          content=$(jq -r '.inputs.localproperties' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          echo "$content" > ${{ env.gradleRoot }}/local.properties
        
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17
          
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.gradleRoot }}
          
      # FIX: Ensure we call bash explicitly on the file path to completely bypass the "Is a directory" routing issue
      - name: build
        if: ${{ github.event.inputs.sign == false || github.event.inputs.sign == 'false' }}
        run: |
          cd ${{ env.gradleRoot }}
          chmod +x ./gradlew
          bash ./gradlew ${{ github.event.inputs.module }}:assembleRelease
          
      # FIX: Ensure we call bash explicitly on the file path to completely bypass the "Is a directory" routing issue
      - name: build & sign
        if: ${{ github.event.inputs.sign == true || github.event.inputs.sign == 'true' }}
        run: |
          cd ${{ env.gradleRoot }}
          chmod +x ./gradlew
          bash ./gradlew ${{ github.event.inputs.module }}:assembleRelease -Pandroid.injected.signing.store.file='${{ github.workspace }}/grab-keystore.jks' -Pandroid.injected.signing.store.password='grab-pwd' -Pandroid.injected.signing.key.alias='sign' -Pandroid.injected.signing.key.password='grab-pwd'
          
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.projectName }}${{ env.dirName }} - ${{ github.event.inputs.module }}
          path: ${{ github.workspace }}/${{ env.gradleRoot }}/${{ github.event.inputs.module }}/build/outputs/apk/release/*.apk

name: build apk

on:
  workflow_dispatch:
    inputs:
      repo-url:
        description: 'git clone url'
        required: true
      repo-commit:
        description: 'commit'
      repo-dir:
        description: 'dir ("/..")'
      module:
        description: 'module'
        required: true
        default: 'app'
      googleservices:
        description: 'google-services.json (content)'
      localproperties:
        description: 'local.properties (content)'
      sign:
        type: boolean
        description: 'sign apk'
        default: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: clone
        run: |
          git clone ${{ github.event.inputs.repo-url }}
          PROJECT_NAME=$(basename -s .git "${{ github.event.inputs.repo-url }}")
          echo "projectName=$PROJECT_NAME" >> $GITHUB_ENV
          echo "dirName=$(echo '${{ github.event.inputs.repo-dir }}' | sed -r 's/[/]+/ - /g')" >> $GITHUB_ENV
        
      - name: select commit
        if: ${{ github.event.inputs.repo-commit != '' }}
        run: |
          cd ${{ env.projectName }}
          git checkout ${{ github.event.inputs.repo-commit }}

      # FIX 1: Generate missing settings.gradle to cleanly bind 'Approot/app' as a valid structural module
      # Also safely normalise your custom 'gradlew/' distribution directory structure
      # We force use of the workspace root directory for the build context
       Kakao:
      - name: prepare environment and stitch components
        run: |
          cd ${{ env.projectName }}
          
          # Inject settings.gradle at root to tell Gradle where 'app' is hidden
          echo "include ':Approot:app'" > settings.gradle
          
          # Fix the gradlew file-clash: Generate a valid, executable root runner script 
          # that targets the wrapper property configurations hidden in your folder
          echo '#!/usr/bin/env bash' > ./gradlew_runner
          echo 'exec gradle "$@"' >> ./gradlew_runner
          chmod +x ./gradlew_runner
          
          # Pass paths down into the pipeline
          echo "gradleRoot=${{ env.projectName }}" >> $GITHUB_ENV
          
      - name: bypass root gradle validation
        run: |
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          touch gradlew
        
      - name: add google-services.json
        if: ${{ github.event.inputs.googleservices != '' }}
        run: |
          content=$(jq -r '.inputs.googleservices' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          mkdir -p ${{ env.gradleRoot }}/Approot/${{ github.event.inputs.module }}
          echo "$content" > ${{ env.gradleRoot }}/Approot/${{ github.event.inputs.module }}/google-services.json
        
      - name: add local.properties
        if: ${{ github.event.inputs.localproperties != '' }}
        run: |
          content=$(jq -r '.inputs.localproperties' $GITHUB_EVENT_PATH)
          echo "::add-mask::$content"
          mkdir -p ${{ env.gradleRoot }}
          echo "$content" > ${{ env.gradleRoot }}/local.properties
        
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17
          
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.gradleRoot }}
          
      # FIX 2: Execute the custom build script pointing directly to the stitched component path ':Approot:app'
      - name: build
        if: ${{ github.event.inputs.sign == false || github.event.inputs.sign == 'false' }}
        run: |
          cd ${{ env.gradleRoot }}
          bash ./gradlew_runner :Approot:${{ github.event.inputs.module }}:assembleRelease
          
      - name: build & sign
        if: ${{ github.event.inputs.sign == true || github.event.inputs.sign == 'true' }}
        run: |
          cd ${{ env.gradleRoot }}
          bash ./gradlew_runner :Approot:${{ github.event.inputs.module }}:assembleRelease -Pandroid.injected.signing.store.file='${{ github.workspace }}/grab-keystore.jks' -Pandroid.injected.signing.store.password='grab-pwd' -Pandroid.injected.signing.key.alias='sign' -Pandroid.injected.signing.key.password='grab-pwd'
          
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.projectName }}${{ env.dirName }} - outputs
          path: ${{ github.workspace }}/${{ env.gradleRoot }}/Approot/${{ github.event.inputs.module }}/build/outputs/apk/release/*.apk
